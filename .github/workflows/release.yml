name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Extract version
        id: extract_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ env.VERSION }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t ghcr.io/hhumna/student-ml-api:${{ env.VERSION }} \
            -t ghcr.io/hhumna/student-ml-api:latest \
            -t ghcr.io/hhumna/student-ml-api:${{ github.sha }} \
            .
          
      - name: Push Docker image
        run: |
          docker push ghcr.io/hhumna/student-ml-api:${{ env.VERSION }}
          docker push ghcr.io/hhumna/student-ml-api:latest
          docker push ghcr.io/hhumna/student-ml-api:${{ github.sha }}
